# pueue-agent プロジェクト設定

project_id = "{{PROJECT_ID}}"
pueue_group = "{{PUEUE_GROUP}}"

# campaign・予算・実行状態の正本は service の SQLite です。
# .pueue-agent/state.json は agent 用の bounded scratch projection です。
# submission は experiment（既定）または control を選びます。
# control は履歴には残りますが、guardrails.max_experiments を消費しません。

[agent]
program = "codex"
args = ["exec", "{prompt}"]
timeout_minutes = 60
max_retries = 2

# 通常 agent / Periodic DeepCheck の会話継続は opt in（既定 fresh）。
# decision / diagnosis は常に fresh。code-change editor の継続は別管理。
[agent.context]
mode = "fresh" # fresh | resume | resume_latest
# mode = "resume" の場合だけ、次の session_id が必要。
# session_id = "019..."

[check]
interval_minutes = 10
# 0 は Periodic DeepCheck を無効化する（正の分数を指定した場合だけ opt in）。
deep_check_interval_minutes = 0
stall_minutes = 30
log_tail_bytes = 65536
extra_log_paths = []

# pattern は省略可能な class（[a-z_]{1,32}）を持ち、running health の信号分類に使われる。
[[check.patterns]]
name = "numerical-instability"
regex = "NaN|Inf"
action = "wake"
confirm_matches = 1
class = "numerical"

[[check.patterns]]
name = "python-traceback"
regex = "Traceback"
action = "wake"
confirm_matches = 1

[[check.patterns]]
name = "cuda-error"
regex = "CUDA (error|out of memory)"
action = "wake"
confirm_matches = 1
class = "oom"

# 出力停止時の既定 action は notify。自動終了する場合は kill と待ち時間を明示する。
[check.stall]
action = "notify"
kill_after_minutes = 0

[guardrails]
max_consecutive_failures = 3
max_experiments = 20
max_agent_runs = 100
