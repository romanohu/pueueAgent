# pueue-agent プロジェクト設定

project_id = "{{PROJECT_ID}}"
pueue_group = "{{PUEUE_GROUP}}"

# supervisor の機械的な状態は .pueue-agent/state.json が canonical です。
# submission は experiment（既定）または control を選びます。
# control は履歴には残りますが、guardrails.max_experiments を消費しません。

[agent]
program = "codex"
args = ["exec", "{prompt}"]
timeout_minutes = 60
max_retries = 2

# 会話コンテキストの継続は opt in。既定値は fresh context。
[agent.context]
mode = "fresh" # fresh | resume | resume_latest
# mode = "resume" の場合だけ、次の session_id が必要。
# session_id = "019..."

[check]
interval_minutes = 10
# legacy の互換設定。Periodic DeepCheck は deep_check_interval_minutes だけで有効化し、
# この値だけでは agent を起動しない。
deep_check_every = 6
# 0 は Periodic DeepCheck を無効化する（正の分数を指定した場合だけ opt in）。
deep_check_interval_minutes = 0
stall_minutes = 30
log_tail_bytes = 65536
extra_log_paths = []

[[check.patterns]]
name = "numerical-instability"
regex = "NaN|Inf"
action = "wake"
confirm_matches = 1

[[check.patterns]]
name = "python-traceback"
regex = "Traceback"
action = "wake"
confirm_matches = 1

[[check.patterns]]
name = "cuda-error"
regex = "CUDA (error|out of memory)"
action = "wake"
confirm_matches = 1

# 出力停止時の既定 action は notify。自動終了する場合は kill と待ち時間を明示する。
[check.stall]
action = "notify"
kill_after_minutes = 0

[guardrails]
max_consecutive_failures = 3
max_experiments = 20
max_agent_runs = 100
