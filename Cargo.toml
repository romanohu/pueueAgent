[package]
name = "pueue-agent"
version = "0.1.0"
edition = "2021"

[[test]]
name = "cli_help"
path = "tests/integration/cli_help.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
